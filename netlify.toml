[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://github.com https://media.the420code.org; media-src 'self' https://media.the420code.org; connect-src 'self' https://cdn.jsdelivr.net; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The orphan of Part I, retired 25 September 2026 (see _redirects for the whole reason). Forced,
# so it fires even if the file ever comes back; the fragment lands the reader on AP20, where that
# text stands now.
[[redirects]]
  from = "/proofs/part-1/"
  to = "/proofs/#ap20"
  status = 301
  force = true

[[redirects]]
  from = "/proofs/part-1"
  to = "/proofs/#ap20"
  status = 301
  force = true

# Working files are not pages (14 October 2026). The repository is the site, so every file in it can be asked for;
# these are the tools and notes the work is made with, linked from no page, and they are not served. The public
# record stays served: the predictions (/prereg/), the proofs and their instruments, the freezes, the verifiers.
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true
